<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    
    .features {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .features li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      color: #666;
    }
    
    .features li:last-child {
      border-bottom: none;
    }
    
    .features li::before {
      content: '✓ ';
      color: #667eea;
      font-weight: bold;
      margin-right: 8px;
    }
    
    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>🏆 Best Price Finder</h1>
  
  <div class="info">
    <strong>Active on Amazon, Ebay and others!</strong><br>
    This extension automatically finds the best price per item on search results.
  </div>
  
  <ul class="features">
    <li>Calculates price per item</li>
    <li>Highlights the best deal</li>
    <li>Auto-scrolls to best price</li>
    <li>Works across all pages</li>
  </ul>
  
  <div class="footer">
    Just browse normally!
  </div>
</body>
</html>
